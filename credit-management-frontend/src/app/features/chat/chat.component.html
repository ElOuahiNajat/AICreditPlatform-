<div class="chat-wrapper">
  <div class="chat-container">
    <div class="chat-header">
      <div class="chat-title">
        <i class="fas fa-robot"></i>
        <h2>Assistant Virtuel</h2>
      </div>
      <div class="status-indicator">
        <span class="status-dot"></span>
        En ligne
      </div>
    </div>

    <div class="messages-container">
      <div *ngFor="let msg of messages" [ngClass]="{'user-msg': msg.from==='user', 'bot-msg': msg.from==='bot'}">
        <div class="message-content">
          {{ msg.text }}
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-wrapper">
        <input [(ngModel)]="question" placeholder="Écrivez votre question..." (keyup.enter)="sendMessage()"/>
        <button (click)="sendMessage()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

  /* Centrage de tout le contenu */
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    font-family: 'Inter', sans-serif;
  }

  .chat-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    padding: 20px;
    box-sizing: border-box;
  }

  .chat-container {
    width: 100%;
    max-width: 450px;
    background: #ffffff;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 25px 50px -12px rgba(0, 0, 0, 0.25),
      0 0 0 1px rgba(0, 0, 0, 0.05);
    height: 600px;
    display: flex;
    flex-direction: column;
    transition: all 0.3s ease;
  }

  .chat-container:hover {
    transform: translateY(-5px);
    box-shadow:
      0 30px 60px -12px rgba(0, 0, 0, 0.3),
      0 0 0 1px rgba(0, 0, 0, 0.05);
  }

  .chat-header {
    background: linear-gradient(135deg, #6c5ce7 0%, #8e44ad 100%);
    color: white;
    padding: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  .chat-header::before {
    content: '';
    position: absolute;
    top: -50px;
    right: -50px;
    width: 150px;
    height: 150px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    z-index: 0;
  }

  .chat-title {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 1;
    justify-content: center;
    flex: 1;
  }

  .chat-title i {
    font-size: 26px;
    background: rgba(255, 255, 255, 0.2);
    padding: 12px;
    border-radius: 14px;
    backdrop-filter: blur(10px);
  }

  .chat-title h2 {
    margin: 0;
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: 0.5px;
    text-align: center;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    opacity: 0.95;
    background: rgba(255, 255, 255, 0.15);
    padding: 8px 14px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 1;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    background: #00b894;
    border-radius: 50%;
    display: inline-block;
    animation: pulse 1.5s infinite;
    box-shadow: 0 0 10px rgba(0, 184, 148, 0.5);
  }

  .messages-container {
    flex: 1;
    padding: 24px;
    overflow-y: auto;
    background: #f8f9fa;
    display: flex;
    flex-direction: column;
    gap: 18px;
    background-image:
      radial-gradient(circle at 25px 25px, rgba(0, 0, 0, 0.03) 2%, transparent 50%),
      radial-gradient(circle at 75px 75px, rgba(0, 0, 0, 0.03) 2%, transparent 50%);
    background-size: 100px 100px;
    justify-content: flex-start;
    align-items: center;
  }

  .user-msg {
    align-self: flex-end;
    max-width: 78%;
    animation: slideInRight 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    justify-content: flex-end;
    width: 100%;
  }

  .bot-msg {
    align-self: flex-start;
    max-width: 78%;
    animation: slideInLeft 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: flex;
    justify-content: flex-start;
    width: 100%;
  }

  .message-content {
    padding: 16px 20px;
    border-radius: 20px;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
    position: relative;
    line-height: 1.5;
    font-size: 0.95rem;
    word-wrap: break-word;
    max-width: 100%;
    text-align: left;
  }

  .user-msg .message-content {
    background: linear-gradient(135deg, #6c5ce7, #8e44ad);
    color: white;
    border-bottom-right-radius: 6px;
    text-align: left;
  }

  .bot-msg .message-content {
    background: white;
    color: #2d3436;
    border-bottom-left-radius: 6px;
    border: 1px solid rgba(0, 0, 0, 0.05);
    text-align: left;
  }

  .input-container {
    padding: 24px;
    background: white;
    border-top: 1px solid rgba(0, 0, 0, 0.05);
    display: flex;
    justify-content: center;
  }

  .input-wrapper {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: center;
    width: 100%;
    max-width: 400px;
  }

  input {
    flex: 1;
    padding: 17px 22px;
    border: 2px solid #e0e0e0;
    border-radius: 28px;
    outline: none;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
    background: #f8f9fa;
    text-align: left;
  }

  input:focus {
    border-color: #6c5ce7;
    background: white;
    box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.15);
  }

  input::placeholder {
    color: #a0a0a0;
    text-align: left;
  }

  button {
    width: 58px;
    height: 58px;
    background: linear-gradient(135deg, #6c5ce7, #8e44ad);
    color: white;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.3s ease;
    box-shadow: 0 5px 18px rgba(108, 92, 231, 0.35);
  }

  button:hover {
    transform: translateY(-4px) rotate(5deg);
    box-shadow: 0 10px 25px rgba(108, 92, 231, 0.5);
  }

  button:active {
    transform: translateY(0);
  }

  button i {
    font-size: 22px;
    transition: transform 0.3s ease;
  }

  button:hover i {
    transform: translateX(3px);
  }

  /* Animations */
  @keyframes slideInRight {
    from {
      opacity: 0;
      transform: translateX(40px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  @keyframes slideInLeft {
    from {
      opacity: 0;
      transform: translateX(-40px) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  @keyframes pulse {
    0% {
      transform: scale(1);
      opacity: 1;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.8;
    }
    100% {
      transform: scale(1);
      opacity: 1;
    }
  }

  /* Scrollbar styling */
  .messages-container::-webkit-scrollbar {
    width: 8px;
  }

  .messages-container::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.03);
    border-radius: 10px;
    margin: 5px;
  }

  .messages-container::-webkit-scrollbar-thumb {
    background: linear-gradient(to bottom, #6c5ce7, #8e44ad);
    border-radius: 10px;
  }

  .messages-container::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(to bottom, #5d4cd9, #7d39a0);
  }

  /* Responsive design */
  @media (max-width: 500px) {
    .chat-wrapper {
      padding: 0;
    }

    .chat-container {
      height: 100vh;
      max-width: 100%;
      border-radius: 0;
    }

    .message-content {
      max-width: 85%;
      padding: 14px 18px;
    }

    .chat-header {
      padding: 20px;
    }

    .messages-container {
      padding: 20px;
    }

    .input-container {
      padding: 20px;
    }

    input {
      padding: 15px 18px;
    }

    button {
      width: 52px;
      height: 52px;
    }
  }
</style>
