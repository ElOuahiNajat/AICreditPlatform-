<div class="scorings-container">
  <div class="scorings-header">
    <h2><i class="fas fa-chart-line"></i> Historique des Scorings</h2>
    <div class="header-actions">
      <div class="filter-section">
        <label for="clientFilter">Filtrer par Client ID:</label>
        <input
          id="clientFilter"
          type="number"
          [(ngModel)]="clientIdFilter"
          (change)="loadHistory(clientIdFilter)"
          min="1"
          class="filter-input"
        >
      </div>
      <button class="btn-add" (click)="openAddModal()">
        <i class="fas fa-plus"></i> Nouveau Scoring
      </button>
    </div>
  </div>

  <div class="scorings-content">
    <div *ngIf="scorings.length === 0" class="empty-state">
      <i class="fas fa-inbox"></i>
      <h3>Aucun scoring trouvé</h3>
      <p>Commencez par ajouter un nouveau scoring pour cet historique.</p>
    </div>

    <div *ngFor="let scoring of scorings" class="scoring-card" [class]="'status-' + scoring.statut">
      <div class="scoring-info">
        <div class="scoring-main">
          <h3 class="scoring-title">Scoring #{{scoring.id}}</h3>
          <span class="scoring-date">{{scoring.dateCreation | date:'dd/MM/yyyy HH:mm'}}</span>
        </div>
        <div class="scoring-details">
          <div class="detail-item">
            <span class="label">Client ID:</span>
            <span class="value">{{scoring.clientId}}</span>
          </div>
          <div class="detail-item">
            <span class="label">Score:</span>
            <span class="value score-value">{{scoring.score}}/100</span>
          </div>
          <div class="detail-item">
            <span class="label">Statut:</span>
            <span class="status-badge">{{scoring.statut}}</span>
          </div>
        </div>
      </div>

      <div class="scoring-actions">
        <div class="status-actions" *ngIf="scoring.statut !== 'approved' && scoring.statut !== 'rejected'">
          <button class="btn-approve" (click)="updateStatus(scoring, 'approved')">
            <i class="fas fa-check"></i> Approuver
          </button>
          <button class="btn-reject" (click)="updateStatus(scoring, 'rejected')">
            <i class="fas fa-times"></i> Rejeter
          </button>
        </div>
        <button class="btn-delete" (click)="deleteScoring(scoring)">
          <i class="fas fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<style>

  @import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css');

    justify-content: space-between;
    align-items: center;

  }

    font-size: 1.5rem;

    align-items: center;

    flex-wrap: wrap;

  .scorings-content {

  }

  .scoring-title {
    margin: 0;
    font-weight: 600;

  }

  .scoring-date {
    color: #64748b;
    font-size: 0.9rem;
  }

  .scoring-details {
    display: flex;

  }

  .detail-item {

  .label {

  }

  .scoring-actions {
    display: flex;

    gap: 12px;
  }

  .status-actions {
    display: flex;
    gap: 8px;
  }

  .btn-approve, .btn-reject, .btn-delete {
    padding: 8px 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s ease;
  }

  .btn-approve {
    background: #00b89420;
    color: #00b894;
  }

  .btn-approve:hover {
    background: #00b894;
    color: white;
  }

  .btn-reject {
    background: #d6303120;
    color: #d63031;
  }

  .btn-reject:hover {
    background: #d63031;
    color: white;

  .btn-delete {
    background: #64748b20;
    color: #64748b;
    padding: 8px;

  .btn-delete:hover {
    background: #d63031;
    color: white;
  }

  /* Responsive design */
  @media (max-width: 768px) {
    .scorings-container {
      padding: 16px;
    }

    .scorings-header {
      flex-direction: column;
      align-items: stretch;
      text-align: center;
    }

    .header-actions {

    }

    .scoring-details {
      flex-direction: column;

    }

    .scoring-actions {
      justify-content: center;
      margin-top: 16px;
    }
  }
</style>
